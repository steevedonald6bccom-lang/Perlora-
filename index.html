<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
      maximum-scale=1.0, user-scalable=no">

<title>STEVE OS — Ordinateur mobile</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial, sans-serif;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    background:linear-gradient(135deg,#07111f,#102d4a,#07111f);
    color:white;
}

/* BUREAU */
#desktop{
    position:absolute;
    inset:0;
    padding:25px;
    padding-bottom:65px;
    overflow:hidden;
}

/* FOND */
.wallpaper{
    position:absolute;
    inset:0;
    z-index:-1;
    background:
      radial-gradient(circle at 20% 20%,#164e77 0%,transparent 35%),
      radial-gradient(circle at 80% 70%,#172554 0%,transparent 40%),
      linear-gradient(135deg,#020617,#0f2740);
}

/* ICÔNES */
.icons{
    display:flex;
    flex-direction:column;
    gap:20px;
    width:90px;
}

.desktop-icon{
    width:80px;
    padding:8px;
    text-align:center;
    border-radius:10px;
    cursor:pointer;
    user-select:none;
}

.desktop-icon:hover{
    background:rgba(255,255,255,.12);
}

.desktop-icon .emoji{
    font-size:38px;
    display:block;
}

.desktop-icon span{
    font-size:12px;
    text-shadow:0 2px 5px black;
}

/* BARRE DES TÂCHES */
#taskbar{
    position:absolute;
    bottom:0;
    left:0;
    right:0;
    height:58px;
    background:rgba(3,10,20,.90);
    backdrop-filter:blur(15px);
    border-top:1px solid rgba(255,255,255,.15);
    display:flex;
    align-items:center;
    padding:7px;
    gap:7px;
    z-index:1000;
}

.start{
    width:45px;
    height:45px;
    border-radius:10px;
    border:1px solid rgba(255,255,255,.15);
    background:#0d2945;
    color:white;
    font-size:23px;
    cursor:pointer;
}

.start:hover{
    background:#164a75;
}

.task{
    min-width:45px;
    height:45px;
    border:0;
    border-radius:9px;
    background:transparent;
    color:white;
    font-size:20px;
    cursor:pointer;
}

.task:hover{
    background:rgba(255,255,255,.12);
}

.clock{
    margin-left:auto;
    text-align:center;
    font-size:11px;
    min-width:65px;
}

/* MENU DÉMARRER */
#startMenu{
    position:absolute;
    bottom:65px;
    left:8px;
    width:270px;
    background:rgba(5,15,28,.96);
    border:1px solid rgba(255,255,255,.15);
    border-radius:15px;
    padding:15px;
    display:none;
    z-index:2000;
    box-shadow:0 15px 40px rgba(0,0,0,.5);
}

#startMenu h2{
    margin-bottom:15px;
}

.menu-btn{
    width:100%;
    padding:13px;
    margin:5px 0;
    border:0;
    border-radius:9px;
    background:#102b46;
    color:white;
    text-align:left;
    cursor:pointer;
}

.menu-btn:hover{
    background:#164a75;
}

/* FENÊTRES */
.window{
    position:absolute;
    top:90px;
    left:50%;
    transform:translateX(-50%);
    width:min(90%,700px);
    height:min(70%,500px);
    background:#f4f7fb;
    color:#111827;
    border-radius:14px;
    overflow:hidden;
    display:none;
    z-index:500
