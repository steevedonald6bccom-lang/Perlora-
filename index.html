<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PERLORA — Créations en perles</title>

<meta name="description"
content="Perlora — créations artisanales en perles, porte-clés, bracelets, sacs, décorations et objets personnalisés.">

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  scroll-behavior:smooth;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  color:#071d55;
  background:#fff;
}

/* =========================
   BARRE SUPERIEURE
========================= */

.topbar{
  background:#061c63;
  color:white;
  min-height:38px;
  display:flex;
  justify-content:center;
  align-items:center;
  gap:45px;
  padding:8px 15px;
  font-size:14px;
  font-weight:bold;
  flex-wrap:wrap;
}

.topbar span{
  display:flex;
  align-items:center;
  gap:7px;
}

/* =========================
   NAVIGATION
========================= */

.navbar{
  height:100px;
  background:white;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 35px;
  box-shadow:0 2px 15px rgba(0,0,0,.08);
  position:sticky;
  top:0;
  z-index:100;
}

.menu-btn{
  display:none;
  border:0;
  background:none;
  font-size:30px;
  color:#08256f;
}

.logo{
  display:flex;
  align-items:center;
  gap:12px;
  text-decoration:none;
  color:#08256f;
}

.logo-icon{
  font-size:50px;
  color:#d59b20;
}

.logo-text{
  font-family:Georgia,serif;
  font-size:34px;
  font-weight:bold;
  letter-spacing:2px;
}

.logo-sub{
  display:block;
  color:#b07a19;
  font-size:11px;
  letter-spacing:2px;
  text-align:center;
}

.nav-links{
  display:flex;
  align-items:center;
  gap:35px;
}

.nav-links a{
  text-decoration:none;
  color:#111;
  font-size:16px;
  padding:12px 0;
  position:relative;
}

.nav-links a:hover,
.nav-links a.active{
  color:#0b36a0;
}

.nav-links a.active:after{
  content:"";
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  height:2px;
  background:#0b36a0;
}

.panier-nav{
  width:68px;
  height:68px;
  border-radius:50%;
  background:#f5f3ee;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-decoration:none;
  color:#071d55;
  font-weight:bold;
  position:relative;
}

.panier-nav .icone{
  font-size:28px;
}

.badge{
  position:absolute;
  right:3px;
  top:1px;
  background:#0b2d87;
  color:white;
  width:25px;
  height:25px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:12px;
  border:2px solid #dca92b;
}

/* =========================
   HERO
========================= */

.hero{
  min-height:510px;
  background:
    radial-gradient(circle at 75% 30%,rgba(40,112,255,.35),transparent 25%),
    radial-gradient(circle at 15% 60%,rgba(30,80,200,.3),transparent 30%),
    linear-gradient(135deg,#03144b,#092b78 55%,#03164f);
  color:white;
  position:relative;
  overflow:hidden;
  display:flex;
  align-items:center;
  padding:45px 6%;
}

.hero:before{
  content:"✦  ✧    ✦       ✧   ✦";
  position:absolute;
  inset:20px;
  color:#ffd45b;
  font-size:25px;
  letter-spacing:55px;
  opacity:.8;
}

.hero-content{
  width:52%;
  position:relative;
  z-index:2;
}

.hero-script{
  color:#e9b83c;
  font-family:cursive;
  font-size:38px;
  margin-bottom:5px;
}

.hero h1{
  font-family:Georgia,serif;
  font-size:70px;
  letter-spacing:3px;
  line-height:1;
  margin-bottom:12px;
}

.hero-title{
  color:#eab73b;
  font-size:21px;
  font-weight:bold;
  letter-spacing:2px;
  margin-bottom:18px;
}

.hero p{
  font-size:18px;
  line-height:1.6;
  max-width:550px;
}

.hero-buttons{
  display:flex;
  gap:14px;
  margin-top:25px;
  flex-wrap:wrap;
}

.btn{
  display:inline-flex;
  justify-content:center;
  align-items:center;
  gap:9px;
  padding:14px 28px;
  border-radius:30px;
  text-decoration:none;
  font-weight:bold;
  transition:.2s;
  cursor:pointer;
}

.btn:hover{
  transform:translateY(-2px);
}

.btn-gold{
  background:#0b48c9;
  color:white;
  border:1px solid #eab83d;
  box-shadow:0 4px 15px rgba(0,0,0,.2);
